<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="electrobun-webkit-app-region-drag titlebar">
    <span class="titlebar-label">Harbor</span>
    <button class="electrobun-webkit-app-region-no-drag" id="close-btn">✕</button>
  </div>

  <div class="app-container">
    <aside class="sidebar">
      <h2>Accounts</h2>
      <ul id="account-list">
        <li class="loading">Loading accounts...</li>
      </ul>
    </aside>

    <main class="content">
      <div class="toolbar">
        <button id="refresh-btn">↻ Refresh</button>
      </div>
      <ul id="email-list"></ul>
      <div id="email-detail" class="email-detail">
        <p class="placeholder">Select an email to view</p>
      </div>
    </main>
  </div>

  <script src="index.ts"></script>
</body>
</html>
